deploymentSpec:
  executors:
    exec-collect-human-feedback:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - collect_human_feedback
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3'  && \
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef collect_human_feedback(\n    s3_endpoint: str,\n    s3_access_key:\
          \ str,\n    s3_secret_key: str,\n    bucket: str = \"mlflow-artifacts\"\
          ,\n) -> str:\n    \"\"\"Read pending human-feedback DPO pairs and move them\
          \ to used/.\"\"\"\n    import json\n    import uuid\n\n    import boto3\n\
          \n    print(\"=\" * 60)\n    print(\"COLLECT HUMAN FEEDBACK STEP\")\n  \
          \  print(\"=\" * 60)\n\n    s3 = boto3.client(\n        \"s3\",\n      \
          \  endpoint_url=s3_endpoint,\n        aws_access_key_id=s3_access_key,\n\
          \        aws_secret_access_key=s3_secret_key,\n    )\n\n    pending_prefix\
          \ = \"preferences/human-feedback/pending/\"\n    used_prefix = \"preferences/human-feedback/used/\"\
          \n\n    pairs = []\n    consumed_keys = []\n    paginator = s3.get_paginator(\"\
          list_objects_v2\")\n\n    for page in paginator.paginate(Bucket=bucket,\
          \ Prefix=pending_prefix):\n        for obj in page.get(\"Contents\", []):\n\
          \            key = obj[\"Key\"]\n            if not key.endswith(\".jsonl\"\
          ):\n                continue\n            try:\n                body = s3.get_object(Bucket=bucket,\
          \ Key=key)[\"Body\"].read().decode()\n                for line in body.strip().splitlines():\n\
          \                    line = line.strip()\n                    if not line:\n\
          \                        continue\n                    pair = json.loads(line)\n\
          \                    if pair.get(\"prompt\") and pair.get(\"chosen\") and\
          \ pair.get(\"rejected\"):\n                        pairs.append(pair)\n\
          \                consumed_keys.append(key)\n                print(f\"  Read\
          \ {key}\")\n            except Exception as e:\n                print(f\"\
          \  Warning: skipping {key}: {e}\")\n\n    print(f\"  Found {len(pairs)}\
          \ human feedback pairs from {len(consumed_keys)} files\")\n\n    for key\
          \ in consumed_keys:\n        filename = key.split(\"/\")[-1]\n        dest_key\
          \ = f\"{used_prefix}{filename}\"\n        s3.copy_object(\n            Bucket=bucket,\n\
          \            CopySource={\"Bucket\": bucket, \"Key\": key},\n          \
          \  Key=dest_key,\n        )\n        s3.delete_object(Bucket=bucket, Key=key)\n\
          \        print(f\"  Moved {key} -> {dest_key}\")\n\n    if not pairs:\n\
          \        print(\"  No human feedback pairs found. Returning empty path.\"\
          )\n        return \"\"\n\n    run_id = uuid.uuid4().hex[:12]\n    out_key\
          \ = f\"preferences/human-feedback-batch-{run_id}.jsonl\"\n    body = \"\\\
          n\".join(json.dumps(p) for p in pairs)\n    s3.put_object(Bucket=bucket,\
          \ Key=out_key, Body=body.encode())\n\n    out_path = f\"s3://{bucket}/{out_key}\"\
          \n    print(f\"  Wrote {len(pairs)} pairs to {out_path}\")\n    return out_path\n\
          \n"
