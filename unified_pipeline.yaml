        output_prefix:
          parameterType: STRING
        s3_access_key:
          parameterType: STRING
        s3_endpoint:
          parameterType: STRING
        s3_secret_key:
          parameterType: STRING
        teacher_api_key:
          parameterType: STRING
        teacher_api_url:
