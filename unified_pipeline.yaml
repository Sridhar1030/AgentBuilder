          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef extract_code_review_gold(\n    s3_endpoint: str,\n    s3_access_key:\
          \ str,\n    s3_secret_key: str,\n    synthetic_bucket: str,\n    synthetic_prefix:\
          \ str,\n    output_s3_path: str,\n) -> str:\n    \"\"\"Read pre-built code\
          \ review training JSONL from MinIO.\"\"\"\n    import json\n    import random\n\
          \    import boto3\n\n    print(\"=\" * 60)\n    print(\"EXTRACT CODE REVIEW\
          \ GOLD DATA STEP\")\n    print(\"=\" * 60)\n\n    s3 = boto3.client(\n \
          \       \"s3\",\n        endpoint_url=s3_endpoint,\n        aws_access_key_id=s3_access_key,\n\
          \        aws_secret_access_key=s3_secret_key,\n    )\n\n    records = []\n\
          \    paginator = s3.get_paginator(\"list_objects_v2\")\n\n    for page in\
          \ paginator.paginate(Bucket=synthetic_bucket, Prefix=synthetic_prefix):\n\
          \        for item in page.get(\"Contents\", []):\n            key = item[\"\
          Key\"]\n            if not key.endswith(\".jsonl\"):\n                continue\n\
          \            try:\n                body = s3.get_object(Bucket=synthetic_bucket,\
