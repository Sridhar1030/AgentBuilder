          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef dpo_finetune(\n    sft_model_s3_path: str,\n    pref_data_s3_path:\
          \ str,\n    model_version: str,\n    s3_endpoint: str,\n    s3_access_key:\
          \ str,\n    s3_secret_key: str,\n    dpo_output_s3_path: str = \"\",\n \
          \   num_epochs: int = 3,\n    batch_size: int = 1,\n    learning_rate: float\
          \ = 5e-5,\n    lora_r: int = 16,\n    lora_alpha: int = 32,\n    dpo_beta:\
          \ float = 0.3,\n    min_pairs: int = 10,\n) -> str:\n    \"\"\"Create a\
          \ PyTorchJob for multi-GPU DPO training.\"\"\"\n    import time\n\n    import\
          \ boto3\n    from kubernetes import client, config\n\n    print(\"=\" *\
          \ 60)\n    print(\"DPO FINE-TUNE STEP (PyTorchJob, multi-GPU)\")\n    print(\"\
          =\" * 60)\n    print(f\"  SFT model:    {sft_model_s3_path}\")\n    print(f\"\
          \  Pref data:    {pref_data_s3_path}\")\n    print(f\"  Version:      {model_version}\"\
          )\n    print(f\"  Epochs:       {num_epochs}\")\n    print(f\"  Batch size:\
          \   {batch_size}\")\n    print(f\"  LR:           {learning_rate}\")\n \
          \   print(f\"  LoRA r/alpha: {lora_r}/{lora_alpha}\")\n    print(f\"  DPO\
          \ beta:     {dpo_beta}\")\n    print(f\"  Min pairs:    {min_pairs}\")\n\
          \    print(\"=\" * 60)\n\n    model_output_s3_path = dpo_output_s3_path\
          \ if dpo_output_s3_path else sft_model_s3_path\n\n    s3 = boto3.client(\n\
          \        \"s3\",\n        endpoint_url=s3_endpoint,\n        aws_access_key_id=s3_access_key,\n\
          \        aws_secret_access_key=s3_secret_key,\n    )\n\n    parts = pref_data_s3_path.replace(\"\
          s3://\", \"\").split(\"/\", 1)\n    obj = s3.get_object(Bucket=parts[0],\
          \ Key=parts[1])\n    lines = [l for l in obj[\"Body\"].read().decode().strip().split(\"\
          \\n\") if l.strip()]\n    num_pref_pairs = len(lines)\n\n    print(f\"[{time.strftime('%H:%M:%S')}]\
          \ Preference data has {num_pref_pairs} pairs (min required: {min_pairs})\"\
          )\n    if num_pref_pairs < min_pairs:\n        print(f\"[{time.strftime('%H:%M:%S')}]\
          \ SKIPPING DPO: only {num_pref_pairs} pairs (< {min_pairs}). Returning SFT\
          \ model.\")\n        return sft_model_s3_path\n    print(f\"[{time.strftime('%H:%M:%S')}]\
          \ Sufficient pairs. Proceeding with DPO training.\")\n\n    config.load_incluster_config()\n\
          \    apps_api = client.AppsV1Api()\n    custom_api = client.CustomObjectsApi()\n\
          \    core_api = client.CoreV1Api()\n\n    namespace = \"sridharproject\"\
          \n    job_name = f\"dpo-{int(time.time())}\"\n    image = \"image-registry.openshift-image-registry.svc:5000/sridharproject/distillation-trainer:v1.1.5\"\
          \n\n    # --- GPU evacuation and restore helpers ---\n    isvc_deployment\
          \ = \"code-review-llm-predictor\"\n\n    def _scale_down_kserve():\n   \
          \     try:\n            dep = apps_api.read_namespaced_deployment(isvc_deployment,\
          \ namespace)\n            if dep.spec.replicas and dep.spec.replicas > 0:\n\
          \                print(f\"[{time.strftime('%H:%M:%S')}] Scaling down {isvc_deployment}\
          \ to free GPU node...\")\n                apps_api.patch_namespaced_deployment_scale(\n\
          \                    isvc_deployment, namespace, {\"spec\": {\"replicas\"\
          : 0}},\n                )\n                for _ in range(60):\n       \
          \             time.sleep(5)\n                    pods = core_api.list_namespaced_pod(\n\
          \                        namespace, label_selector=f\"app=isvc.{isvc_deployment}\"\
          ,\n                    )\n                    if not pods.items:\n     \
          \                   break\n                print(f\"[{time.strftime('%H:%M:%S')}]\
          \ {isvc_deployment} scaled to 0 -- GPU freed\")\n        except Exception\
          \ as e:\n            print(f\"[{time.strftime('%H:%M:%S')}] KServe scale-down\
          \ skipped: {e}\")\n\n    def _restore_kserve():\n        \"\"\"Scale KServe\
