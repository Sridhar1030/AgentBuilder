# PIPELINE DEFINITION
# Name: agentic-continual-learning
# Description: Unified Agentic Continual Learning pipeline: eval-analyze, eval-dataset, distill (SFT+DPO), eval-run, eval-optimize, deploy-candidate.
# Inputs:
#    dpo_beta: float [Default: 0.3]
#    dpo_epochs: int [Default: 3.0]
#    max_new_sdg_examples: int [Default: 10.0]
#    max_supplement_questions: int [Default: 5.0]
#    min_dpo_pairs: int [Default: 10.0]
#    model_version: str [Default: '']
#    num_epochs: int [Default: 3.0]
#    s3_access_key: str [Default: 'minioadmin']
#    s3_secret_key: str [Default: 'minioadmin123']
#    teacher_api_key: str [Default: '']
#    teacher_api_url: str [Default: 'http://ollama.sridharproject.svc.cluster.local:11434']
#    teacher_model: str [Default: 'qwen2.5-coder:32b-instruct-q4_K_M']
components:
  comp-collect-human-feedback:
    executorLabel: exec-collect-human-feedback
    inputDefinitions:
      parameters:
        bucket:
          defaultValue: mlflow-artifacts
          isOptional: true
          parameterType: STRING
        s3_access_key:
          parameterType: STRING
        s3_endpoint:
          parameterType: STRING
        s3_secret_key:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-condition-1:
    dag:
      tasks:
        deploy-model-2:
          cachingOptions: {}
          componentRef:
            name: comp-deploy-model-2-2
          inputs:
            parameters:
              isvc_name:
                runtimeValue:
                  constant: code-review-llm
              model_s3_path:
                componentInputParameter: pipelinechannel--distill-pipeline-sft_model_path
              namespace:
                runtimeValue:
                  constant: sridharproject
          taskInfo:
            name: deploy-model-2
    inputDefinitions:
      parameters:
        pipelinechannel--distill-pipeline-sft_model_path:
          parameterType: STRING
        pipelinechannel--quality-gate-Output:
          parameterType: STRING
  comp-deploy-model:
    executorLabel: exec-deploy-model
    inputDefinitions:
      parameters:
        isvc_name:
          parameterType: STRING
        model_s3_path:
          parameterType: STRING
        namespace:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-deploy-model-2:
    executorLabel: exec-deploy-model-2
    inputDefinitions:
      parameters:
        isvc_name:
          parameterType: STRING
        model_s3_path:
          parameterType: STRING
        namespace:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-deploy-model-2-2:
    executorLabel: exec-deploy-model-2-2
    inputDefinitions:
      parameters:
        isvc_name:
          parameterType: STRING
        model_s3_path:
          parameterType: STRING
        namespace:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-distill-pipeline:
    dag:
      outputs:
        parameters:
          dpo_model_path:
            valueFromParameter:
              outputParameterKey: Output
              producerSubtask: dpo-finetune
          dpo_output_s3_path:
            valueFromParameter:
              outputParameterKey: dpo_model_output_path
              producerSubtask: resolve-version
          sft_model_path:
            valueFromParameter:
              outputParameterKey: Output
              producerSubtask: finetune
          version:
            valueFromParameter:
              outputParameterKey: version
              producerSubtask: resolve-version
      tasks:
        collect-human-feedback:
          cachingOptions: {}
          componentRef:
            name: comp-collect-human-feedback
          dependentTasks:
          - extract-code-review-gold
          inputs:
            parameters:
              s3_access_key:
                componentInputParameter: s3_access_key
              s3_endpoint:
                componentInputParameter: s3_endpoint
              s3_secret_key:
                componentInputParameter: s3_secret_key
          taskInfo:
            name: collect-human-feedback
        deploy-model:
          cachingOptions: {}
          componentRef:
            name: comp-deploy-model
          dependentTasks:
          - finetune
          inputs:
            parameters:
              isvc_name:
                componentInputParameter: isvc_name
              model_s3_path:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: finetune
              namespace:
                componentInputParameter: namespace
          taskInfo:
            name: deploy-model
        dpo-finetune:
          cachingOptions: {}
          componentRef:
            name: comp-dpo-finetune
          dependentTasks:
          - finetune
          - merge-preferences
          - resolve-version
          inputs:
            parameters:
              dpo_beta:
                componentInputParameter: dpo_beta
              dpo_output_s3_path:
                taskOutputParameter:
                  outputParameterKey: dpo_model_output_path
                  producerTask: resolve-version
              min_pairs:
                componentInputParameter: min_dpo_pairs
              model_version:
                taskOutputParameter:
                  outputParameterKey: version
                  producerTask: resolve-version
              num_epochs:
                componentInputParameter: dpo_epochs
              pref_data_s3_path:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: merge-preferences
              s3_access_key:
                componentInputParameter: s3_access_key
              s3_endpoint:
                componentInputParameter: s3_endpoint
              s3_secret_key:
                componentInputParameter: s3_secret_key
              sft_model_s3_path:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: finetune
          taskInfo:
            name: dpo-finetune
        extract-code-review-gold:
          cachingOptions: {}
          componentRef:
            name: comp-extract-code-review-gold
          dependentTasks:
          - resolve-version
          inputs:
            parameters:
              output_s3_path:
                taskOutputParameter:
                  outputParameterKey: gold_data_path
                  producerTask: resolve-version
              s3_access_key:
                componentInputParameter: s3_access_key
              s3_endpoint:
                componentInputParameter: s3_endpoint
              s3_secret_key:
                componentInputParameter: s3_secret_key
              synthetic_bucket:
                componentInputParameter: synthetic_bucket
              synthetic_prefix:
                componentInputParameter: synthetic_prefix
          taskInfo:
            name: extract-code-review-gold
        extract-preferences:
          cachingOptions: {}
          componentRef:
            name: comp-extract-preferences
          dependentTasks:
          - deploy-model
          - resolve-version
          inputs:
            parameters:
              max_supplement_questions:
                componentInputParameter: max_supplement_questions
              mlflow_tracking_uri:
                componentInputParameter: mlflow_tracking_uri
              model_version:
                taskOutputParameter:
                  outputParameterKey: version
                  producerTask: resolve-version
              pipelinechannel--isvc_name:
                componentInputParameter: isvc_name
              pipelinechannel--namespace:
                componentInputParameter: namespace
              question_bank_s3_path:
                componentInputParameter: question_bank_s3
              s3_access_key:
                componentInputParameter: s3_access_key
              s3_endpoint:
                componentInputParameter: s3_endpoint
              s3_secret_key:
                componentInputParameter: s3_secret_key
              sft_run_name_prefix:
                runtimeValue:
                  constant: pipeline-eval-
              student_url:
                runtimeValue:
                  constant: http://{{$.inputs.parameters['pipelinechannel--isvc_name']}}-predictor.{{$.inputs.parameters['pipelinechannel--namespace']}}.svc.cluster.local:8080
              system_prompt:
                componentInputParameter: system_prompt
              teacher_api_key:
                componentInputParameter: teacher_api_key
              teacher_api_url:
                componentInputParameter: teacher_api_url
              teacher_model:
                componentInputParameter: teacher_model
          taskInfo:
            name: extract-preferences
        finetune:
          cachingOptions: {}
          componentRef:
            name: comp-finetune
          dependentTasks:
          - extract-code-review-gold
          - resolve-version
          inputs:
            parameters:
              base_model_id:
                taskOutputParameter:
                  outputParameterKey: prev_model_path
                  producerTask: resolve-version
              gold_data_path:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: extract-code-review-gold
              model_output_s3_path:
                taskOutputParameter:
                  outputParameterKey: model_output_path
                  producerTask: resolve-version
              num_epochs:
                componentInputParameter: num_epochs
              s3_access_key:
                componentInputParameter: s3_access_key
              s3_endpoint:
                componentInputParameter: s3_endpoint
              s3_secret_key:
                componentInputParameter: s3_secret_key
          taskInfo:
            name: finetune
        merge-preferences:
          cachingOptions: {}
          componentRef:
            name: comp-merge-preferences
          dependentTasks:
          - collect-human-feedback
          - extract-code-review-gold
          - extract-preferences
          inputs:
            parameters:
              gold_data_path:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: extract-code-review-gold
              human_feedback_path:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: collect-human-feedback
              pipeline_pref_path:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: extract-preferences
              s3_access_key:
                componentInputParameter: s3_access_key
              s3_endpoint:
                componentInputParameter: s3_endpoint
              s3_secret_key:
                componentInputParameter: s3_secret_key
          taskInfo:
            name: merge-preferences
        resolve-version:
          cachingOptions: {}
          componentRef:
            name: comp-resolve-version
          inputs:
            parameters:
              explicit_version:
                componentInputParameter: model_version
              gold_bucket:
                componentInputParameter: gold_bucket
              hf_base_model_id:
                componentInputParameter: base_model_id
              model_bucket:
                componentInputParameter: model_bucket
              model_prefix:
                componentInputParameter: model_prefix
              s3_access_key:
                componentInputParameter: s3_access_key
              s3_endpoint:
                componentInputParameter: s3_endpoint
              s3_secret_key:
                componentInputParameter: s3_secret_key
          taskInfo:
            name: resolve-version
    inputDefinitions:
      parameters:
        base_model_id:
          parameterType: STRING
        dpo_beta:
          defaultValue: 0.3
          isOptional: true
          parameterType: NUMBER_DOUBLE
        dpo_epochs:
          defaultValue: 3.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        gold_bucket:
          parameterType: STRING
        isvc_name:
          parameterType: STRING
        max_supplement_questions:
          defaultValue: 5.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        min_dpo_pairs:
          defaultValue: 10.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        mlflow_tracking_uri:
          parameterType: STRING
        model_bucket:
          parameterType: STRING
        model_prefix:
          parameterType: STRING
        model_version:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        namespace:
          parameterType: STRING
        num_epochs:
          defaultValue: 3.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        question_bank_s3:
          parameterType: STRING
        s3_access_key:
          parameterType: STRING
        s3_endpoint:
          parameterType: STRING
        s3_secret_key:
          parameterType: STRING
        synthetic_bucket:
          parameterType: STRING
        synthetic_prefix:
          parameterType: STRING
        system_prompt:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        teacher_api_key:
          parameterType: STRING
        teacher_api_url:
          parameterType: STRING
        teacher_model:
          parameterType: STRING
    outputDefinitions:
      parameters:
        dpo_model_path:
          parameterType: STRING
        dpo_output_s3_path:
          parameterType: STRING
        sft_model_path:
          parameterType: STRING
