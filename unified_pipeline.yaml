          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef resolve_version(\n    s3_endpoint: str,\n    s3_access_key: str,\n\
          \    s3_secret_key: str,\n    model_bucket: str,\n    model_prefix: str,\n\
          \    gold_bucket: str,\n    hf_base_model_id: str = \"Qwen/Qwen2.5-Coder-1.5B-Instruct\"\
          ,\n    explicit_version: str = \"\",\n) -> NamedTuple(\"VersionOutputs\"\
          , [(\"version\", str), (\"gold_data_path\", str), (\"model_output_path\"\
          , str), (\"dpo_model_output_path\", str), (\"prev_model_path\", str)]):\n\
          \    \"\"\"Find the latest student-1b-vN/ in MinIO and return vN+1 with\
          \ paths.\"\"\"\n    import re\n    from collections import namedtuple\n\
          \    import boto3\n\n    print(\"=\" * 60)\n    print(\"RESOLVE VERSION\
          \ STEP\")\n    print(\"=\" * 60)\n    print(f\"  Model bucket: {model_bucket}\"\
          )\n    print(f\"  Model prefix: {model_prefix}\")\n    print(f\"  Gold bucket:\
          \  {gold_bucket}\")\n    print(f\"  Explicit ver: {explicit_version or '(auto)'}\"\
          )\n    print(\"=\" * 60)\n\n    s3 = boto3.client(\n        \"s3\",\n  \
          \      endpoint_url=s3_endpoint,\n        aws_access_key_id=s3_access_key,\n\
          \        aws_secret_access_key=s3_secret_key,\n    )\n\n    paginator =\
          \ s3.get_paginator(\"list_objects_v2\")\n    version_numbers = []\n\n  \
          \  for page in paginator.paginate(Bucket=model_bucket, Prefix=model_prefix,\
          \ Delimiter=\"/\"):\n        for cp in page.get(\"CommonPrefixes\", []):\n\
          \            folder = cp[\"Prefix\"]\n            match = re.search(r\"\
          -v(\\d+)/?$\", folder)\n            if match:\n                version_numbers.append(int(match.group(1)))\n\
          \n    if explicit_version:\n        version = explicit_version\n       \
          \ print(f\"Using explicit version: {version}\")\n    elif version_numbers:\n\
          \        latest = max(version_numbers)\n        version = f\"v{latest +\
          \ 1}\"\n        print(f\"Found versions: {sorted(version_numbers)}. Latest:\
          \ v{latest}. Next: {version}\")\n    else:\n        version = \"v1\"\n \
          \       print(f\"No existing versions found under {model_bucket}/{model_prefix}.\
          \ Starting at {version}\")\n\n    if version_numbers:\n        prev_version\
          \ = max(version_numbers)\n        sft_path = f\"s3://{model_bucket}/{model_prefix}v{prev_version}/\"\
          \n        dpo_path = f\"s3://{model_bucket}/{model_prefix}v{prev_version}-dpo/\"\
          \n        gate_marker_key = f\"{model_prefix}v{prev_version}-dpo/.gate-passed\"\
          \n\n        # Prefer the DPO model if it passed the quality gate (marker\
          \ file exists)\n        use_dpo = False\n        try:\n            s3.head_object(Bucket=model_bucket,\
          \ Key=gate_marker_key)\n            use_dpo = True\n            print(f\"\
          Found .gate-passed marker at {gate_marker_key}\")\n        except s3.exceptions.NoSuchKey:\n\
          \            print(f\"No .gate-passed marker at {gate_marker_key} -- using\
          \ SFT model\")\n        except Exception as e:\n            err_code = getattr(e,\
          \ \"response\", {}).get(\"Error\", {}).get(\"Code\", \"\")\n           \
          \ if err_code in (\"404\", \"NoSuchKey\"):\n                print(f\"No\
          \ .gate-passed marker at {gate_marker_key} -- using SFT model\")\n     \
          \       else:\n                print(f\"WARNING: S3 error checking gate\
          \ marker ({e}) -- falling back to SFT model\")\n\n        if use_dpo:\n\
          \            prev_model_path = dpo_path\n            print(f\"Previous model:\
          \ {prev_model_path} (DPO-improved, gate passed)\")\n        else:\n    \
          \        prev_model_path = sft_path\n            print(f\"Previous model:\
          \ {prev_model_path} (SFT checkpoint)\")\n    else:\n        prev_model_path\
          \ = hf_base_model_id\n        print(f\"No previous model found -- SFT will\
          \ start from HuggingFace base: {hf_base_model_id}\")\n\n    gold_data_path\
          \ = f\"s3://{gold_bucket}/gold/train-{version}.jsonl\"\n    model_output_path\
          \ = f\"s3://{model_bucket}/{model_prefix}{version}/\"\n    dpo_model_output_path\
          \ = f\"s3://{model_bucket}/{model_prefix}{version}-dpo/\"\n\n    print(f\"\
          Version: {version}\")\n    print(f\"Gold data path: {gold_data_path}\")\n\
          \    print(f\"Model output path (SFT): {model_output_path}\")\n    print(f\"\
          Model output path (DPO): {dpo_model_output_path}\")\n    print(f\"Prev model\
          \ path: {prev_model_path or '(none)'}\")\n\n    Outputs = namedtuple(\"\
          VersionOutputs\", [\"version\", \"gold_data_path\", \"model_output_path\"\
          , \"dpo_model_output_path\", \"prev_model_path\"])\n    return Outputs(version=version,\
          \ gold_data_path=gold_data_path, model_output_path=model_output_path, dpo_model_output_path=dpo_model_output_path,\
          \ prev_model_path=prev_model_path)\n\n"
        image: python:3.11-slim
    exec-traffic-shift:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - traffic_shift
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'requests' 'kubernetes==32.0.1'\
          \ 'mlflow' 'boto3'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef traffic_shift(\n    eval_results: dict,\n    gateway_url: str,\n\
          \    namespace: str,\n    virtualservice_name: str = \"code-review-gateway\"\
          ,\n    shift_increment: int = 10,\n    mlflow_tracking_uri: str = \"\",\n\
          \    model_version: str = \"unknown\",\n    s3_endpoint: str = \"\",\n \
          \   s3_access_key: str = \"\",\n    s3_secret_key: str = \"\",\n) -> dict:\n\
          \    \"\"\"Shift traffic from teacher to student if eval score improved.\n\
          \n    Returns dict with shift decision, old/new split, and scores.\n   \
          \ \"\"\"\n    import json\n    import os\n    import sys\n    import requests\n\
          \    import mlflow\n\n    sys.stdout.reconfigure(line_buffering=True)\n\n\
          \    if mlflow_tracking_uri.startswith(\"https://\"):\n        os.environ.setdefault(\"\
          MLFLOW_TRACKING_INSECURE_TLS\", \"true\")\n    if s3_endpoint:\n       \
          \ os.environ.setdefault(\"MLFLOW_S3_ENDPOINT_URL\", s3_endpoint)\n     \
          \   if s3_endpoint.startswith(\"https://\"):\n            os.environ.setdefault(\"\
          MLFLOW_S3_IGNORE_TLS\", \"true\")\n    if s3_access_key:\n        os.environ.setdefault(\"\
          AWS_ACCESS_KEY_ID\", s3_access_key)\n    if s3_secret_key:\n        os.environ.setdefault(\"\
          AWS_SECRET_ACCESS_KEY\", s3_secret_key)\n\n    print(\"=\" * 60)\n    print(\"\
          TRAFFIC SHIFT (Canary Progressive Migration)\")\n    print(\"=\" * 60)\n\
          \n    current_score = eval_results.get(\"composite_score\", 0.0)\n    gate_result\
          \ = eval_results.get(\"gate_result\", \"unknown\")\n    print(f\"  Current\
          \ eval score: {current_score:.4f}\")\n    print(f\"  Gate result:      \
          \  {gate_result}\")\n\n    gw = gateway_url.rstrip(\"/\")\n\n    # -- Read\
          \ current state from gateway ------------------------------------\n    try:\n\
          \        resp = requests.get(f\"{gw}/split\", timeout=10)\n        resp.raise_for_status()\n\
          \        split_data = resp.json()\n    except Exception as exc:\n      \
          \  print(f\"  WARNING: Could not read gateway split: {exc}\")\n        split_data\
          \ = {\n            \"teacher\": 90,\n            \"student\": 10,\n    \
          \        \"last_student_score\": 0.0,\n        }\n\n    old_teacher = split_data[\"\
          teacher\"]\n    old_student = split_data[\"student\"]\n    last_score =\
          \ split_data.get(\"last_student_score\", 0.0)\n\n    print(f\"  Current\
          \ split: teacher={old_teacher}% student={old_student}%\")\n    print(f\"\
          \  Last score:    {last_score:.4f}\")\n\n    # -- Decide shift -------------------------------------------------------\n\
          \    shifted = False\n    reason = \"\"\n    new_teacher = old_teacher\n\
          \    new_student = old_student\n\n    if gate_result == \"fail\":\n    \
          \    reason = f\"Quality gate failed (score={current_score:.4f}). No shift.\"\
          \n        print(f\"  Decision: {reason}\")\n    elif current_score > last_score:\n\
          \        new_student = min(old_student + shift_increment, 100)\n       \
          \ new_teacher = 100 - new_student\n        shifted = True\n        reason\
          \ = (\n            f\"Score improved {last_score:.4f} -> {current_score:.4f}.\
          \ \"\n            f\"Shifting +{shift_increment}% to student.\"\n      \
          \  )\n        print(f\"  Decision: {reason}\")\n        print(f\"  New split:\
          \ teacher={new_teacher}% student={new_student}%\")\n    else:\n        reason\
          \ = (\n            f\"No improvement ({current_score:.4f} <= {last_score:.4f}).\
          \ \"\n            \"Keeping current split.\"\n        )\n        print(f\"\
          \  Decision: {reason}\")\n\n    # -- Apply shift via gateway (cascades to\
          \ ConfigMap + VirtualService) ---\n    if shifted:\n        try:\n     \
          \       resp = requests.post(\n                f\"{gw}/split\",\n      \
          \          json={\n                    \"teacher\": new_teacher,\n     \
          \               \"student\": new_student,\n                    \"last_student_score\"\
          : current_score,\n                    \"reason\": f\"pipeline-{model_version}\"\
          ,\n                },\n                timeout=10,\n            )\n    \
          \        resp.raise_for_status()\n            print(f\"  Gateway updated:\
          \ {resp.json()}\")\n        except Exception as exc:\n            print(f\"\
          \  WARNING: Gateway update failed: {exc}\")\n            print(\"  Falling\
          \ back to direct VirtualService + ConfigMap patch...\")\n            _fallback_patch(\n\
          \                namespace, virtualservice_name, new_teacher, new_student,\n\
          \                current_score,\n            )\n    else:\n        if current_score\
          \ > last_score:\n            try:\n                requests.post(\n    \
          \                f\"{gw}/split\",\n                    json={\n        \
          \                \"teacher\": old_teacher,\n                        \"student\"\
          : old_student,\n                        \"last_student_score\": current_score,\n\
          \                        \"reason\": f\"score-update-{model_version}\",\n\
          \                    },\n                    timeout=10,\n             \
          \   )\n            except Exception:\n                pass\n\n    # -- Log\
          \ to MLflow ------------------------------------------------------\n   \
          \ if mlflow_tracking_uri:\n        mlflow.set_tracking_uri(mlflow_tracking_uri)\n\
          \        mlflow.set_experiment(\"CodeReview-Eval-Hub\")\n        with mlflow.start_run(run_name=f\"\
          traffic-shift-{model_version}\"):\n            mlflow.set_tag(\"model_version\"\
          , model_version)\n            mlflow.set_tag(\"eval_type\", \"traffic_shift\"\
          )\n            mlflow.set_tag(\"shifted\", str(shifted))\n            mlflow.log_metric(\"\
          current_score\", current_score)\n            mlflow.log_metric(\"last_score\"\
          , last_score)\n            mlflow.log_metric(\"teacher_weight\", new_teacher)\n\
          \            mlflow.log_metric(\"student_weight\", new_student)\n      \
          \      mlflow.log_metric(\"shift_applied\", 1 if shifted else 0)\n     \
          \   print(\"  Traffic shift logged to MLflow\")\n\n    result = {\n    \
          \    \"shifted\": shifted,\n        \"reason\": reason,\n        \"old_split\"\
          : {\"teacher\": old_teacher, \"student\": old_student},\n        \"new_split\"\
          : {\"teacher\": new_teacher, \"student\": new_student},\n        \"scores\"\
          : {\n            \"current\": current_score,\n            \"previous\":\
          \ last_score,\n        },\n    }\n\n    print(\"\\n\" + \"=\" * 60)\n  \
          \  print(f\"  Result: {'SHIFTED' if shifted else 'NO SHIFT'}\")\n    print(f\"\
          \  Split:  teacher={new_teacher}% student={new_student}%\")\n    print(\"\
          =\" * 60)\n\n    return result\n\n"
        image: python:3.11-slim
