                  #\n# Run with:\n#   python3 agent-eval-harness/skills/eval-run/scripts/score.py\
                  \ judges \\\n#     --run-id <id> --config eval/eval.yaml\n\nname:\
                  \ code-review-slm-eval\ndescription: Evaluate the distilled code\
                  \ review SLM against structured judges\nskill: distill-code-review\n\
                  \nexecution:\n  mode: case\n  arguments: \"{diff}\"\n\nrunner:\n\
                  \  type: openai-compatible\n\nmodels:\n  skill: /mnt/models\n  judge:\
                  \ qwen2.5-coder:32b-instruct-q4_K_M\n\nmlflow:\n  experiment: CodeReview-Eval-Hub\n\
                  \ndataset:\n  path: eval/dataset/cases\n  schema: |\n    Each case\
                  \ directory contains:\n    - input.yaml: YAML file with 'diff' (the\
                  \ code diff to review),\n      'category' (bug/security/performance/kubernetes/reliability/\n\
                  \      style/clean), and 'expected_behavior' describing what a correct\n\
                  \      review should identify (or 'clean: no issues' if the code\
                  \ is fine).\n    - reference.md: Gold standard review from the teacher\
                  \ model.\n    - annotations.yaml: Metadata for judges -- has_bug\
                  \ (bool),\n      expected_issues (list of strings), category (string).\n\
                  \noutputs:\n  - path: artifacts\n    schema: |\n      One text file\
                  \ per case (response.md) containing the student\n      model's code\
                  \ review response.\n\ntraces:\n  metrics: true\n  stdout: true\n\
                  \njudges:\n  # Judge 1: Correctness (inline check -- no LLM needed)\n\
                  \  # Checks both directions:\n  # - Bug present: review must NOT\
                  \ say LGTM, and must mention at least\n  #   one keyword from expected_issues.\n\
                  \  # - Clean code: review must NOT hallucinate serious problems.\n\
                  \  - name: correctness\n    description: |\n      Does the review\
                  \ correctly identify whether the code has issues?\n      For buggy\
                  \ code, verifies the review mentions expected issues.\n      For\
                  \ clean code, verifies no hallucinated serious problems.\n    check:\
                  \ |\n      review = outputs.get(\"artifacts_content\", \"\").lower()\n\
                  \      if not review:\n          return False, \"No review output\
                  \ found\"\n      annotations = outputs.get(\"annotations\", {})\n\
                  \      has_bug = annotations.get(\"has_bug\", True)\n      if has_bug:\n\
                  \          lgtm_phrases = [\"lgtm\", \"looks good to me\", \"no\
                  \ issues found\",\n                          \"code looks clean\"\
                  , \"no problems\", \"no concerns\"]\n          if any(p in review\
                  \ for p in lgtm_phrases):\n              return False, \"Review\
                  \ missed a real bug (said LGTM/no issues)\"\n          expected\
                  \ = annotations.get(\"expected_issues\", [])\n          if expected:\n\
                  \              matched = []\n              for issue in expected:\n\
                  \                  keywords = [w.lower() for w in issue.split()\
                  \ if len(w) > 3][:4]\n                  if any(kw in review for\
                  \ kw in keywords):\n                      matched.append(issue)\n\
                  \              if not matched:\n                  return False,\
                  \ f\"Review didn't address expected issues: {expected[:2]}\"\n \
                  \         return True, \"Review identified a relevant issue in buggy\
                  \ code\"\n      else:\n          false_positive_phrases = [\n  \
                  \            \"vulnerability\", \"injection\", \"exploit\",\n  \
                  \            \"critical bug\", \"serious issue\", \"major flaw\"\
                  ,\n              \"security risk\", \"memory leak\", \"race condition\"\
                  ,\n              \"must be fixed\", \"needs to be fixed\", \"should\
                  \ be fixed immediately\",\n          ]\n          flagged = [p for\
                  \ p in false_positive_phrases if p in review]\n          if flagged:\n\
                  \              return False, f\"Hallucinated serious issues in clean\
                  \ code: {flagged}\"\n          return True, \"Correctly handled\
                  \ clean code\"\n\n  # Judge 2: Conciseness (inline check -- no LLM\
                  \ needed)\n  - name: conciseness\n    description: |\n      Is the\
                  \ review concise enough for a PR comment? Target is under\n    \
                  \  200 words. Verbose reviews (200-400 words) partially fail.\n\
                  \      Reviews over 400 words fully fail.\n    check: |\n      review\
                  \ = outputs.get(\"artifacts_content\", \"\")\n      if not review:\n\
                  \          return False, \"No review output found\"\n      word_count\
                  \ = len(review.split())\n      if word_count <= 200:\n         \
                  \ return True, f\"Concise review ({word_count} words)\"\n      elif\
                  \ word_count <= 400:\n          return False, f\"Verbose review\
                  \ ({word_count} words, target is under 200)\"\n      else:\n   \
                  \       return False, f\"Far too verbose ({word_count} words)\"\n\
                  \n  # Judge 3: Review Quality (LLM judge -- uses teacher model)\n\
                  \  - name: review_quality\n    description: |\n      Evaluate the\
                  \ quality of the code review: is it actionable,\n      specific,\
                  \ and relevant to the diff? Score 1-5.\n    prompt: |\n      You\
                  \ are evaluating an AI-generated code review comment for a\n   \
                  \   code diff. The review and the original diff are provided below.\n\
                  \n      Score the review 1-5:\n      5: Correctly identifies the\
                  \ key issue, suggests a specific fix, concise\n      4: Identifies\
                  \ the issue correctly but could be more specific or actionable\n\
                  \      3: Partially relevant but misses important details or key\
                  \ issues\n      2: Mostly wrong, addresses the wrong concern, or\
                  \ hallucinates problems\n      1: Completely irrelevant, nonsensical,\
                  \ or empty\n\n      If the code is genuinely clean and the review\
                  \ correctly says so\n      (e.g., \"LGTM\", \"no issues\"), that\
                  \ scores 4-5.\n\n      {{ outputs }}\n\n      {{ annotations }}\n\
                  \n      Respond with a JSON object: {\"score\": <1-5>, \"rationale\"\
                  : \"<brief reason>\"}\n\n  # Judge 4: Format check (inline check\
                  \ -- no LLM needed)\n  - name: format_check\n    description: |\n\
                  \      Does the review avoid generic boilerplate and filler phrases?\n\
                  \      Good reviews get straight to the point.\n    check: |\n \
                  \     review = outputs.get(\"artifacts_content\", \"\").lower()\n\
                  \      if not review:\n          return False, \"No review output\
                  \ found\"\n      filler_phrases = [\n          \"let me analyze\"\
                  ,\n          \"let's examine\",\n          \"here is my review\"\
                  ,\n          \"i will now review\",\n          \"upon careful examination\"\
                  ,\n          \"after thorough analysis\",\n          \"in this code\
                  \ review\",\n          \"overall, the changes\",\n          \"in\
                  \ summary, \",\n          \"to summarize, \",\n      ]\n      found\
                  \ = [p for p in filler_phrases if p in review]\n      if len(found)\
                  \ >= 2:\n          return False, f\"Contains boilerplate filler:\
                  \ {found}\"\n      return True, \"Clean format, gets to the point\"\
                  \n\nthresholds:\n  correctness:\n    min_pass_rate: 0.7\n  conciseness:\n\
                  \    min_pass_rate: 0.8\n  review_quality:\n    min_mean: 3.5\n\
                  \  format_check:\n    min_pass_rate: 0.7\n"
