          \       \"trend\": trend,\n                }\n                if latest\
          \ < 0.7:\n                    weaknesses.append({\n                    \
          \    \"judge\": judge_name,\n                        \"score\": round(latest,\
          \ 4),\n                        \"trend\": trend,\n                    })\n\
          \                print(f\"    {judge_name}: {latest:.4f} ({trend})\")\n\
          \            elif len(values) == 1:\n                trends[judge_name]\
