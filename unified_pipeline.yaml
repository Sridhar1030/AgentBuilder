          s3://\", \"\").split(\"/\", 1)\n    out_bucket, out_key = out_parts[0],\
          \ out_parts[1]\n    body = \"\\n\".join(json.dumps(r) for r in records)\n\
          \    s3.put_object(Bucket=out_bucket, Key=out_key, Body=body.encode())\n\
