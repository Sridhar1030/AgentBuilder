apiVersion: batch/v1
kind: Job
metadata:
  name: baseline-eval-ab
  namespace: sridharproject
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: baseline-eval
    spec:
      restartPolicy: Never
      containers:
        - name: eval
          image: image-registry.openshift-image-registry.svc:5000/sridharproject/distillation-trainer:v1.3.6
          command: ["python", "/opt/scripts/baseline_eval.py"]
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "minioadmin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "minioadmin123"
            - name: HF_HOME
              value: "/tmp/hf_cache"
            - name: MLFLOW_EXPERIMENT
              value: "AgentBuilder-Final"
            - name: TEST_QUESTIONS_FILE
              value: "/opt/config/test_questions.json"
            - name: EVAL_YAML_PATH
              value: "/opt/config/eval.yaml"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: script
              mountPath: /opt/scripts/baseline_eval.py
              subPath: baseline_eval.py
            - name: config
              mountPath: /opt/config
      volumes:
        - name: script
          configMap:
            name: baseline-eval-config
            items:
              - key: baseline_eval.py
                path: baseline_eval.py
        - name: config
          configMap:
            name: baseline-eval-config
