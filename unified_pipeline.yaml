          , \"\")\n            values = runs[metric].dropna().tolist()\n         \
          \   if len(values) >= 2:\n                latest, prev = values[0], values[1]\n\
          \                trend = (\"improving\" if latest > prev else\n        \
          \                 \"declining\" if latest < prev else \"stable\")\n    \
          \            trends[judge_name] = {\n                    \"latest\": round(latest,\
